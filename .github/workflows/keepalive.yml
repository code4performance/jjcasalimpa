# Opcional: faz uma leitura semanal no Supabase para o projeto gratuito não ser pausado
# por inatividade. Só funciona se o site estiver em um repositório do GitHub.
# Configure em Settings → Secrets and variables → Actions:
#   SUPABASE_URL      (ex.: https://abcd1234.supabase.co)
#   SUPABASE_ANON_KEY (a mesma chave de js/config.js)
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 * * 1" # toda segunda-feira, 9h de Brasília
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler configurações da loja
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/settings?select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
